<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Переустановка Windows в Охтирці</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 0;
}

header {
    background: #0078d7;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 700px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.card {
    border: 1px solid #ddd;
    padding: 15px;
    margin: 10px 0;
    border-radius: 8px;
}

.price {
    color: #0078d7;
    font-weight: bold;
}

.button {
    display: inline-block;
    background: #0078d7;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
}
</style>

</head>

<body>

<header>
<h1>🖥️ Переустановка Windows в Охтирці</h1>
<p>Швидке встановлення та налаштування Windows</p>
</header>

<div class="container">

<h2>Доступні версії Windows:</h2>

<div class="card">
<h3>Windows 7</h3>
<p>Без активації: <span class="price">200 грн</span></p>
<p>З активацією: <span class="price">200 грн</span></p>
</div>

<div class="card">
<h3>Windows 10</h3>
<p>Без активації: <span class="price">200 грн</span></p>
<p>З активацією: <span class="price">400 грн</span></p>
</div>

<div class="card">
<h3>Windows 11</h3>
<p>Без активації: <span class="price">300 грн</span></p>
<p>З активацією: <span class="price">500 грн</span></p>
</div>

<h2>В послугу входить:</h2>
<ul>
<li>Встановлення Windows</li>
<li>Драйвери</li>
<li>Базове налаштування</li>
</ul>

